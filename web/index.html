<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة المادة</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1216">
<style>
  :root{--bg:#0f1216;--card:#171c22;--line:#262d36;--fg:#e8edf2;--dim:#93a1b0;--acc:#4d9fff;--warn:#ffb545}
  @media (prefers-color-scheme:light){:root{--bg:#f6f7f9;--card:#fff;--line:#e3e7ec;--fg:#141a20;--dim:#5f6b78;--acc:#0b63d6}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.75 -apple-system,"SF Arabic",system-ui,sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:16px 16px 60px}
  header{padding:8px 0 4px}
  h1{font-size:22px;margin:0}
  .dim{color:var(--dim);font-size:13px}
  .bar{background:#3a2a12;color:var(--warn);border:1px solid #5a4420;padding:10px 13px;border-radius:11px;margin:12px 0;font-size:13.5px;display:none}
  .filters{display:flex;gap:7px;margin:14px 0;overflow-x:auto}
  .filters button{flex:none;background:transparent;border:1px solid var(--line);color:var(--dim);padding:7px 15px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}
  .filters button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin:11px 0}
  .card h2{font-size:17px;margin:0 0 6px}
  .tag{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
  .body{white-space:pre-wrap;margin:6px 0}
  a.file{display:inline-block;margin-top:6px;color:var(--acc);text-decoration:none;border:1px solid var(--line);padding:7px 12px;border-radius:9px;font-size:14px}
  .meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap}
  .hist{background:transparent;border:0;color:var(--dim);font:inherit;font-size:12.5px;cursor:pointer;text-decoration:underline;padding:0}
  .hbox{border-top:1px dashed var(--line);margin-top:10px;padding-top:9px;font-size:13.5px;display:none}
  .hrow{padding:7px 0;border-bottom:1px solid var(--line)}.hrow:last-child{border:0}
  .empty{text-align:center;color:var(--dim);padding:50px 0}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="name">…</h1><div class="dim" id="sub">جارٍ التحميل</div></header>
  <div class="bar" id="bar"></div>
  <div class="filters">
    <button class="on" data-f="all">الكل</button>
    <button data-f="date">المواعيد</button>
    <button data-f="notice">التنبيهات</button>
    <button data-f="file">الملفات</button>
  </div>
  <div id="list"><div class="empty">…</div></div>
  <div class="dim" style="text-align:center;margin-top:30px">كل تعديل محفوظ ومرئي للجميع.</div>
</div>
<script>
/* ← الرابط الوحيد الذي يُلصق مرة واحدة للمشروع كله (نشرة القراءة العامة) */
const API = 'PASTE_READ_EXEC_URL_HERE';

const qs = new URLSearchParams(location.search);
const SID = qs.get('m') || qs.get('madda');
const VC = qs.get('c') || '';
const KEY = 'feed:' + SID + ':' + VC;
let DATA = null, FILTER = 'all';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = t => { try { return new Date(t).toLocaleString('ar-SA',{dateStyle:'medium',timeStyle:'short'}); } catch { return t; } };
const LABEL = { date:'موعد', notice:'تنبيه', file:'ملف', text:'نص' };

function render() {
  if (!DATA) return;
  $('#name').textContent = DATA.subject.name;
  const items = DATA.items.filter(i => FILTER === 'all' || i.current.type === FILTER);
  $('#list').innerHTML = items.length ? items.map(it => {
    const c = it.current;
    return `<article class="card">
      <div style="display:flex;justify-content:space-between;gap:8px"><h2>${esc(c.title)}</h2><span class="tag">${LABEL[c.type]||esc(c.type)}</span></div>
      ${c.body ? `<div class="body">${esc(c.body)}</div>` : ''}
      ${c.fileUrl ? `<a class="file" href="${esc(c.fileUrl)}" target="_blank" rel="noopener">📎 ${esc(c.fileName||'ملف')}</a>` : ''}
      <div class="meta"><span class="dim">${esc(c.authorName)} — ${fmt(c.ts)}</span>
      ${it.history.length > 1 ? `<button class="hist" onclick="tog('${it.entryId}')">عرض السجل الكامل (${it.history.length})</button>` : ''}</div>
      <div class="hbox" id="h-${it.entryId}">${it.history.slice().reverse().map(v => `
        <div class="hrow"><b>نسخة ${v.version}</b> — ${esc(v.authorName)} — ${fmt(v.ts)}
        ${v.deleted ? '<div class="dim">حُذف</div>' : `<div class="body dim">${esc(v.title)}${v.body ? '\n'+esc(v.body) : ''}</div>`}</div>`).join('')}</div>
    </article>`;
  }).join('') : '<div class="empty">لا يوجد محتوى في هذا التصنيف.</div>';
}
function tog(id) { const b = document.getElementById('h-'+id); b.style.display = b.style.display === 'block' ? 'none' : 'block'; }

document.querySelectorAll('.filters button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.filters button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); FILTER = b.dataset.f; render();
});

function showCached() {
  const raw = localStorage.getItem(KEY);
  if (!raw) return false;
  DATA = JSON.parse(raw); render();
  $('#sub').textContent = 'آخر تحديث محفوظ: ' + fmt(DATA.fetchedAt);
  return true;
}
function stale(msg) { $('#bar').style.display = 'block'; $('#bar').textContent = msg; }

async function refresh() {
  try {
    const r = await fetch(`${API}?api=feed&m=${encodeURIComponent(SID)}&c=${encodeURIComponent(VC)}`);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    DATA = j.data;
    localStorage.setItem(KEY, JSON.stringify(DATA));
    render();
    $('#sub').textContent = 'محدَّث — ' + fmt(DATA.fetchedAt);
    $('#bar').style.display = 'none';
  } catch (e) {
    if (!showCached()) {
      $('#sub').textContent = '';
      $('#list').innerHTML = `<div class="empty">${esc(navigator.onLine ? (e.message||'تعذّر التحميل') : 'لا يوجد اتصال، ولا نسخة محفوظة على هذا الجهاز.')}</div>`;
    } else {
      stale('العرض غير محدَّث — لا يوجد اتصال. آخر تحديث: ' + fmt(DATA.fetchedAt));
    }
  }
}

if (!SID) {
  $('#name').textContent = 'رابط غير صالح';
  $('#sub').textContent = 'افتح رابط المادة الذي وصلك.';
} else {
  showCached();
  refresh();
  addEventListener('online', refresh);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
